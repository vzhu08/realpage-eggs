[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realpage-navigator"
version = "0.1.0"
description = "Evidence-backed rental housing rule extraction and evaluation prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.9,<3", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
navigator = "navigator.cli:main"

[tool.setuptools.packages.find]
include = ["navigator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
