{
  "services": [
    {
      "type": "web",
      "name": "realpage-navigator",
      "runtime": "docker",
      "plan": "free",
      "region": "virginia",
      "numInstances": 1,
      "dockerfilePath": "./deploy/Dockerfile",
      "dockerContext": ".",
      "healthCheckPath": "/api/v1/health",
      "autoDeployTrigger": "off",
      "envVars": [
        { "key": "PORT", "value": "8000" },
        { "key": "NAVIGATOR_DATA_DIR", "value": "/opt/navigator-snapshot/snapshot-v1" },
        { "key": "NAVIGATOR_REQUIRE_SNAPSHOT", "value": "1" },
        { "key": "NAVIGATOR_SNAPSHOT_SHA256", "sync": false },
        { "key": "NAVIGATOR_FRONTEND_DIST", "value": "/app/public" },
        { "key": "PYTHON_DOTENV_DISABLED", "value": "1" },
        { "key": "OPENAI_API_KEY", "value": "" },
        { "key": "OPENAI_MODEL", "value": "" }
      ]
    }
  ]
}
