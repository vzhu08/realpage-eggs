<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 408" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="t">From source text to portfolio impact: what the workspace shows at each step</title>
  <desc id="d">Seven steps in a row: source text, encoded rule, property, useful question, date change, portfolio impact and source disagreement. Under them, a band lists what is carried through every step: the exact quote and its offsets, the date precision the source stated, answer provenance, and remaining uncertainty.</desc>
  <rect width="1180" height="408" fill="#f5f2ea"/>
  <text x="30" y="42" font-family="Charter, Georgia, serif" font-size="22" font-weight="700" fill="#17212b">From source text to portfolio impact</text>
  <text x="30" y="66" font-size="13" fill="#596573">Each step shows evaluator output and the text it rests on. The interface evaluates nothing and prefers no source.</text>
  <g font-size="12" fill="#17212b">
    <g>
      <rect x="30" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="30" y="92" width="146" height="5" fill="#c9a227"/>
      <text x="42" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">1 · SOURCE</text>
      <text x="42" y="146" font-weight="700" font-size="14">Captured text</text>
      <text x="42" y="168" fill="#3a4653">Exact quote, offsets,</text>
      <text x="42" y="185" fill="#3a4653">URL, authority,</text>
      <text x="42" y="202" fill="#3a4653">retrieval time, hash</text>
    </g>
    <g>
      <rect x="194" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="194" y="92" width="146" height="5" fill="#1d3557"/>
      <text x="206" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">2 · RULE</text>
      <text x="206" y="146" font-weight="700" font-size="14">Encoded rule</text>
      <text x="206" y="168" fill="#3a4653">Conditions and dates</text>
      <text x="206" y="185" fill="#3a4653">as stated; six separate</text>
      <text x="206" y="202" fill="#3a4653">evidence checks</text>
    </g>
    <g>
      <rect x="358" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="358" y="92" width="146" height="5" fill="#1d3557"/>
      <text x="370" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">3 · PROPERTY</text>
      <text x="370" y="146" font-weight="700" font-size="14">Lookup on a date</text>
      <text x="370" y="168" fill="#3a4653">Stored facts with</text>
      <text x="370" y="185" fill="#3a4653">provenance; how the</text>
      <text x="370" y="202" fill="#3a4653">municipality was set</text>
    </g>
    <g>
      <rect x="522" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="522" y="92" width="146" height="5" fill="#7a4a00"/>
      <text x="534" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">4 · QUESTION</text>
      <text x="534" y="146" font-weight="700" font-size="14">One useful fact</text>
      <text x="534" y="168" fill="#3a4653">Which results it can</text>
      <text x="534" y="185" fill="#3a4653">move; the answer is</text>
      <text x="534" y="202" fill="#3a4653">request-local, labeled</text>
    </g>
    <g>
      <rect x="686" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="686" y="92" width="146" height="5" fill="#40448a"/>
      <text x="698" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">5 · DATE CHANGE</text>
      <text x="698" y="146" font-weight="700" font-size="14">Two dates</text>
      <text x="698" y="168" fill="#3a4653">Timeline of stated</text>
      <text x="698" y="185" fill="#3a4653">dates; a month stays</text>
      <text x="698" y="202" fill="#3a4653">a month</text>
    </g>
    <g>
      <rect x="850" y="92" width="146" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="850" y="92" width="146" height="5" fill="#1b5e41"/>
      <text x="862" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">6 · PORTFOLIO</text>
      <text x="862" y="146" font-weight="700" font-size="14">Impact</text>
      <text x="862" y="168" fill="#3a4653">Definite, uncertain,</text>
      <text x="862" y="185" fill="#3a4653">conflict, blocked —</text>
      <text x="862" y="202" fill="#3a4653">never merged</text>
    </g>
    <g>
      <rect x="1014" y="92" width="136" height="128" rx="8" fill="#fffdf9" stroke="#c3bba8"/>
      <rect x="1014" y="92" width="136" height="5" fill="#962a21"/>
      <text x="1026" y="122" font-size="11" font-weight="700" fill="#596573" letter-spacing="1">7 · DISAGREEMENT</text>
      <text x="1026" y="146" font-weight="700" font-size="14">Two claims</text>
      <text x="1026" y="168" fill="#3a4653">Both texts, side by</text>
      <text x="1026" y="185" fill="#3a4653">side; no winner; the</text>
      <text x="1026" y="202" fill="#3a4653">next step named</text>
    </g>
  </g>
  <g stroke="#596573" stroke-width="1.5" fill="none">
    <path d="M178 156h14M342 156h14M506 156h14M670 156h14M834 156h14M998 156h14"/>
    <path d="M188 152l4 4-4 4M352 152l4 4-4 4M516 152l4 4-4 4M680 152l4 4-4 4M844 152l4 4-4 4M1008 152l4 4-4 4"/>
  </g>
  <rect x="30" y="248" width="1120" height="62" rx="8" fill="#e3e9f2" stroke="#1d3557" stroke-opacity=".35"/>
  <text x="46" y="273" font-size="11" font-weight="700" fill="#1d3557" letter-spacing="1">CARRIED THROUGH EVERY STEP</text>
  <text x="46" y="296" font-size="13" fill="#17212b">The original quotation and its offsets · the date precision the source gave · who supplied each answer · what is still uncertain and what kind of step would close it</text>
  <rect x="30" y="324" width="1120" height="62" rx="8" fill="#fbeed3" stroke="#7a4a00" stroke-opacity=".35"/>
  <text x="46" y="349" font-size="11" font-weight="700" fill="#7a4a00" letter-spacing="1">NEVER SHOWN AS AN ANSWER</text>
  <text x="46" y="372" font-size="13" fill="#17212b">A blocked or failed request as “no impact” · a hypothetical as actual law · a missing source as “no rule” · applicability as compliance or violation · a single confidence score</text>
</svg>
