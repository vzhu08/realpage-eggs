name: Render Free compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-free-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHON_DOTENV_DISABLED: "1"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: ""

jobs:
  free-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Prepare a labeled synthetic secret-file fixture
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from types import SimpleNamespace
          from navigator.demo import build_demo
          from scripts.platform_ops import prepare_release
          from scripts.render_snapshot import prepare, secret_file
          root = Path("artifacts/free")
          store = build_demo(root / "synthetic")
          store.write("change_tests.json", [{"test_id": "SYNTHETIC-CACHE", "type": "as_of", "rule_ids": [],
                                             "as_of_before": "2026-10-01", "as_of_after": "2026-11-15"}])
          frontend = root / "placeholder-frontend"
          frontend.mkdir(parents=True)
          (frontend / "index.html").write_text("Synthetic packaging fixture; Docker builds the actual frontend.")
          prepare_release(SimpleNamespace(data_dir=store.root, frontend_dist=frontend, output=root / "release",
                                          code_revision=os.environ["GITHUB_SHA"], synthetic=True))
          report = prepare(root / "release", root / "package")
          secret_file(Path(report["archive"]), report["sha256"], root / "snapshot.b64")
          PY
      - name: Build with a private snapshot mount
        run: |
          docker build -f deploy/Dockerfile -t navigator-free:test \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg NAVIGATOR_REQUIRE_SNAPSHOT=1 \
            --build-arg NAVIGATOR_SNAPSHOT_SHA256="$(cat artifacts/free/package/snapshot.zip.sha256)" \
            --secret id=snapshot_b64,src=artifacts/free/snapshot.b64 \
            --secret id=snapshot-part-2_b64,src=artifacts/free/snapshot-part-2.b64 .
      - name: Exercise cold start, HTTP and baked caches under Free resource limits
        run: |
          set -euo pipefail
          trap 'docker rm -f navigator-free-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name navigator-free-ci \
            --memory=512m --memory-swap=512m --cpus=0.1 \
            --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 128 \
            -p 127.0.0.1:8032:8000 \
            -e NAVIGATOR_DATA_DIR=/opt/navigator-snapshot/snapshot-v1 navigator-free:test
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path
          import httpx
          from deploy.verify_container import http_smoke
          with httpx.Client(base_url="http://127.0.0.1:8032", timeout=10, trust_env=False) as client:
              deadline = time.monotonic() + 120
              while True:
                  try:
                      client.get("/api/v1/health").raise_for_status()
                      break
                  except httpx.HTTPError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(1)
              expected = json.loads(Path("artifacts/free/synthetic/addresses.json").read_text())
              report = http_smoke("http://127.0.0.1:8032", expected)
              assert client.post("/api/v1/changes", json={"test_id": "SYNTHETIC-CACHE"}).status_code == 200
          # The baked result must be usable without calling Core again or writing to the image.
          check = '''
          from pathlib import Path
          from unittest.mock import patch
          from navigator.evidence import EvidenceStoreView, prepare_rules
          from navigator.models import ChangeRequest
          from navigator.store import Store, cached_changes
          store = Store(Path('/opt/navigator-snapshot/snapshot-v1'))
          rules, _ = prepare_rules(store)
          with patch('navigator.changes.compute_changes', side_effect=AssertionError('Cache was not usable')):
              cached_changes(EvidenceStoreView(store, rules), ChangeRequest(test_id='SYNTHETIC-CACHE'))
          '''
          import textwrap
          subprocess.run(["docker", "exec", "navigator-free-ci", "python", "-c", textwrap.dedent(check)], check=True)
          inspection = json.loads(subprocess.check_output(["docker", "inspect", "navigator-free-ci"]))[0]
          assert inspection["Config"]["User"] == "10001:10001"
          assert inspection["HostConfig"]["Memory"] == 512 * 1024 * 1024
          assert inspection["State"]["OOMKilled"] is False
          report.update(label="SYNTHETIC_NOT_FOR_SUBMISSION", memory_limit_mb=512, cpu_limit=0.1,
                        peak_memory_bytes=int(subprocess.check_output(["docker", "exec", "navigator-free-ci", "cat", "/sys/fs/cgroup/memory.peak"])))
          Path("artifacts/free/http-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-free-verification
          path: artifacts/free/http-report.json
          retention-days: 7
