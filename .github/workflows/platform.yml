name: Platform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHON_DOTENV_DISABLED: "1"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: ""

jobs:
  backend:
    name: Backend and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Test offline software behavior
        run: python -m pytest -q --junitxml=artifacts/backend.xml
      - name: Check generated schema drift
        run: |
          python -m navigator contracts
          git diff --exit-code -- contracts/openapi.json contracts/domain.schema.json contracts/research.schema.json contracts/competition_rule.schema.json
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-results
          path: artifacts/backend.xml
          retention-days: 7

  frontend:
    name: Frontend compatibility and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Derived files are regenerated in this disposable checkout; UX owns source adoption.
      - run: npm run generate
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: frontend/test-results
          retention-days: 7

  container:
    name: Complete container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Build and run the frontend/API image with synthetic data
        run: python deploy/verify_container.py --synthetic --output artifacts/container-ci --port 8028 --build-and-run
      - name: Retain container verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-verification
          path: artifacts/container-ci/*.json
          retention-days: 7
